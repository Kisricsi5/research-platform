name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Backend: types must hold ─────────────────────────────────────────
      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Backend type-check
        working-directory: backend
        run: npx tsc --noEmit

      # ── Frontend: types, build, and the Labyro Standard checks ──────────
      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend build (pointed at the e2e mock API)
        working-directory: frontend
        run: npx vite build
        env:
          VITE_API_URL: http://localhost:5998

      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run verification harness
        working-directory: frontend
        run: npm run verify:e2e
